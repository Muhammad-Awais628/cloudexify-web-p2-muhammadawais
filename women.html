<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop women's sneakers at Monarch Sole — new arrivals and premium styles.">
    <link rel="icon" type="image/x-icon" href="assets/logo.jpg">
    <title>Women Collection | Monarch Sole</title>

    <!-- Preconnects: speed up the critical requests below -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Font (render-blocking but tiny; swap avoids invisible text) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons: not needed for first paint, load non-blocking -->
    <link rel="preload" as="style"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </noscript>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>
    <!-- Header -->
    <div id="header"></div>
    <!-- WOMEN PRODUCTS -->
    <section class="products-section py-5 mt-5">
        <div class="container">
            <h1 class="text-center fw-bold mb-4">
                Women's Collection
            </h1>
            <div class="row mb-5 reveal">
                <div class="col-lg-6 col-md-6 col-12">
                    <div class="filter-form">
                        <label class="form-label">
                            Category
                        </label>
                        <select id="categoryFilter">
                            <option value="all">All Products</option>
                            <option value="new">New Arrivals</option>
                            <option value="sale">Sale</option>
                            <option value="men">Men</option>
                            <option value="women">Women</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-6 col-md-6 col-12">
                    <div class="filter-form">
                        <label class="form-label">
                            Sort By Price
                        </label>
                        <select id="sortFilter">
                            <option value="default">All Prices</option>
                            <option value="100">Under $100</option>
                            <option value="150">Under $150</option>
                            <option value="200">Under $200</option>
                            <option value="low">Price Low → High</option>
                            <option value="high">Price High → Low</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- PRODUCTS GENERATED BY JS -->
            <div class="row g-4" id="productContainer"></div>
        </div>
    </section>
    <!-- Footer -->
    <div id="footer"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Main JS -->
    <script>
        const pageType = "women";
    </script>
    <script src="js/data.js" defer></script>
    <script src="js/script.js" defer></script>

</body>

</html>

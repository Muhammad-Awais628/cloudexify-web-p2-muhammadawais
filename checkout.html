<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete your Monarch Sole order securely.">
    <link rel="icon" type="image/x-icon" href="assets/logo.jpg">
    <title>Checkout | Monarch Sole</title>

    <!-- Preconnects: speed up the critical requests below -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Font (render-blocking but tiny; swap avoids invisible text) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons: not needed for first paint, load non-blocking -->
    <link rel="preload" as="style"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </noscript>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="header"></div>
    <section class="py-5 mt-5">
        <div class="container">
            <form id="checkoutForm" class="needs-validation" novalidate>
                <div class="row">
                    <!-- CUSTOMER INFORMATION -->
                    <div class="col-lg-6">
                        <div class="card p-4">
                            <h3>
                                Customer Information
                            </h3>
                            <div class="form-group">
                                <div class="invalid-feedback">
                                    Please enter your full name.
                                </div>
                                <input class="form-control mb-3" placeholder="Full Name" required>
                            </div>
                            <div class="form-group">
                                <div class="invalid-feedback">
                                    Please enter your email address.
                                </div>
                                <input class="form-control mb-3" placeholder="Email" type="email" required>
                            </div>
                            <div class="form-group">
                                <div class="invalid-feedback">
                                    Please enter your phone number.
                                </div>
                                <input class="form-control mb-3" placeholder="Phone Number" required>
                            </div>
                            <div class="form-group">
                                <div class="invalid-feedback">
                                    Please enter your address.
                                </div>
                                <input class="form-control mb-3" placeholder="Address" required>
                            </div>
                            <div class="form-group">
                                <div class="invalid-feedback">
                                    Please enter your city.
                                </div>
                                <input class="form-control mb-3" placeholder="City" required>
                            </div>
                        </div>
                    </div>
                    <!-- ORDER SUMMARY -->
                    <div class="col-lg-6">
                        <div class="card p-4">
                            <h3>
                                Your Order
                            </h3>
                            <div id="checkoutContainer"></div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-warning w-100 mt-4">
                    Place Order
                </button>
            </form>
            <div id="orderMessage"></div>
        </div>
    </section>
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/script.js" defer></script>

</body>

</html>
